<svg viewBox="0 0 680 920" width="100%" role="img">
  <title>请求流转路径</title>
  <desc>从用户输入到响应返回的完整流转</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    .th { font: 500 13px var(--font-sans, sans-serif); fill: #2C2C2A; }
    .ts { font: 400 11px var(--font-sans, sans-serif); fill: #5F5E5A; }
    .sub { font: 400 10px var(--font-sans, sans-serif); fill: #888780; }
    .io { font: 400 10px var(--font-sans, sans-serif); fill: #378ADD; }
    .num { font: 600 11px var(--font-sans, sans-serif); fill: white; }
    .label { font: 500 10px var(--font-sans, sans-serif); }
  </style>

  <!-- 标题 -->
  <text class="th" x="340" y="18" text-anchor="middle" font-size="14" fill="#2C2C2A">请求流转路径：用户说"帮我提交3万元的采购申请"</text>

  <!-- Step 1 -->
  <circle cx="50" cy="56" r="12" fill="#7F77DD"/>
  <text class="num" x="50" y="60" text-anchor="middle" dominant-baseline="central">1</text>
  <rect x="72" y="38" width="548" height="36" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
  <text class="th" x="88" y="56" dominant-baseline="central" fill="#3C3489">L1 交互呈现层</text>
  <text class="ts" x="220" y="56" dominant-baseline="central">企微渠道接入 → 消息格式标准化 → "帮我提交3万元的采购申请"</text>
  <text class="io" x="88" y="68" dominant-baseline="central" font-size="9">输出：StandardMessage{text, channel, userId, timestamp}</text>

  <!-- 连线 -->
  <line x1="50" y1="68" x2="50" y2="98" stroke="#7F77DD" stroke-width="1" marker-end="url(#a)"/>

  <!-- Step 2 -->
  <circle cx="50" cy="112" r="12" fill="#1D9E75"/>
  <text class="num" x="50" y="116" text-anchor="middle" dominant-baseline="central">2</text>
  <rect x="72" y="94" width="548" height="36" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th" x="88" y="112" dominant-baseline="central" fill="#085041">L2 语义理解层</text>
  <text class="ts" x="220" y="112" dominant-baseline="central">意图识别→"采购申请" 槽位提取→{金额:3万} 语义映射→"提交"="发起审批"</text>
  <text class="io" x="88" y="124" dominant-baseline="central" font-size="9">输出：Intent=submit_purchase, Slots={amount:30000, type:purchase}</text>

  <!-- 连线 -->
  <line x1="50" y1="130" x2="50" y2="160" stroke="#1D9E75" stroke-width="1" marker-end="url(#a)"/>

  <!-- Step 3 -->
  <circle cx="50" cy="174" r="12" fill="#378ADD"/>
  <text class="num" x="50" y="178" text-anchor="middle" dominant-baseline="central">3</text>
  <rect x="72" y="156" width="548" height="46" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text class="th" x="88" y="170" dominant-baseline="central" fill="#0C447C">L3 上下文状态层</text>
  <text class="ts" x="220" y="170" dominant-baseline="central">槽位追踪→缺"供应商名称" | 对话状态机→触发追问策略</text>
  <text class="ts" x="88" y="192" dominant-baseline="central" fill="#E24B4A" font-size="10">追问："请问供应商是哪家公司？"</text>
  <text class="io" x="300" y="192" dominant-baseline="central" font-size="9">输出：Context{filled:[amount,type], missing:[vendor], state:clarifying}</text>

  <!-- 用户回复分支 -->
  <rect x="72" y="210" width="548" height="24" rx="6" fill="none" stroke="#7F77DD" stroke-width="0.5" stroke-dasharray="4 2"/>
  <text class="ts" x="88" y="226" dominant-baseline="central" fill="#7F77DD">用户回复："华为"</text>

  <!-- Step 4 -->
  <circle cx="50" cy="258" r="12" fill="#639922"/>
  <text class="num" x="50" y="262" text-anchor="middle" dominant-baseline="central">4</text>
  <rect x="72" y="240" width="548" height="36" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
  <text class="th" x="88" y="258" dominant-baseline="central" fill="#27500A">L4 记忆与知识层</text>
  <text class="ts" x="220" y="258" dominant-baseline="central">本体解析→"华为"映射到vendor实体 | 知识检索→采购制度>5万需总监审批</text>
  <text class="io" x="88" y="270" dominant-baseline="central" font-size="9">输出：Knowledge{vendor:华为(已验证), rule:采购>5万需总监审批(3万不触发)}</text>

  <!-- 连线 -->
  <line x1="50" y1="276" x2="50" y2="306" stroke="#639922" stroke-width="1" marker-end="url(#a)"/>

  <!-- Step 5 -->
  <circle cx="50" cy="320" r="12" fill="#BA7517"/>
  <text class="num" x="50" y="324" text-anchor="middle" dominant-baseline="central">5</text>
  <rect x="72" y="302" width="548" height="46" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text class="th" x="88" y="316" dominant-baseline="central" fill="#633806">L5 规划与决策层</text>
  <text class="ts" x="220" y="316" dominant-baseline="central">任务拆解→[1.创建采购单 2.提交审批] | 规则校验→3万&lt;5万,无需总监</text>
  <text class="ts" x="88" y="338" dominant-baseline="central" fill="#0F6E56" font-size="10">风险评估→低风险，自动执行</text>
  <text class="io" x="300" y="338" dominant-baseline="central" font-size="9">输出：Plan=[create_po(vendor=华为,amt=30000), submit_approval(assignee=张经理)]</text>

  <!-- 连线 -->
  <line x1="50" y1="348" x2="50" y2="378" stroke="#BA7517" stroke-width="1" marker-end="url(#a)"/>

  <!-- Step 6 -->
  <circle cx="50" cy="392" r="12" fill="#D4537E"/>
  <text class="num" x="50" y="396" text-anchor="middle" dominant-baseline="central">6</text>
  <rect x="72" y="374" width="548" height="46" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text class="th" x="88" y="392" dominant-baseline="central" fill="#72243E">L6 工具与动作执行层</text>
  <text class="ts" x="240" y="392" dominant-baseline="central">调用ERP工具→创建采购单PO-20260611-001</text>
  <text class="ts" x="88" y="410" dominant-baseline="central" fill="#0F6E56" font-size="10">可靠性→幂等键防重复 | 熔断→ERP可用</text>
  <text class="io" x="350" y="410" dominant-baseline="central" font-size="9">输出：ActionResult{po_id:PO-20260611-001, status:created}</text>

  <!-- HITL分支 -->
  <rect x="72" y="428" width="548" height="36" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5" stroke-dasharray="4 2"/>
  <text class="th" x="88" y="446" dominant-baseline="central" fill="#791F1F" font-size="11">如果金额>5万 → 触发HITL</text>
  <text class="ts" x="280" y="446" dominant-baseline="central">L5风险评估→高风险 → L3 HITL状态→等待审批 → L1渲染审批卡片</text>

  <!-- 回程标注 -->
  <text class="th" x="340" y="490" text-anchor="middle" fill="#2C2C2A" font-size="12">响应回程（自下而上）</text>

  <!-- 回程 Step 7 -->
  <circle cx="590" cy="530" r="12" fill="#D4537E"/>
  <text class="num" x="590" y="534" text-anchor="middle" dominant-baseline="central">7</text>
  <rect x="72" y="512" width="500" height="36" rx="8" fill="#FBEAF0" stroke="#D4537E" stroke-width="0.5"/>
  <text class="th" x="88" y="530" dominant-baseline="central" fill="#72243E">L6 结果标准化</text>
  <text class="ts" x="220" y="530" dominant-baseline="central">ActionResult → 统一Response格式 → 包含采购单号+审批状态</text>

  <!-- 回程 Step 8 -->
  <circle cx="590" cy="582" r="12" fill="#378ADD"/>
  <text class="num" x="590" y="586" text-anchor="middle" dominant-baseline="central">8</text>
  <rect x="72" y="564" width="500" height="36" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text class="th" x="88" y="582" dominant-baseline="central" fill="#0C447C">L3 状态更新</text>
  <text class="ts" x="200" y="582" dominant-baseline="central">槽位全部填充 → 对话状态→completed → 长期记忆归档</text>

  <!-- 回程 Step 9 -->
  <circle cx="590" cy="634" r="12" fill="#7F77DD"/>
  <text class="num" x="590" y="638" text-anchor="middle" dominant-baseline="central">9</text>
  <rect x="72" y="616" width="500" height="36" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="0.5"/>
  <text class="th" x="88" y="634" dominant-baseline="central" fill="#3C3489">L1 输出渲染</text>
  <text class="ts" x="200" y="634" dominant-baseline="central">Markdown卡片 → 渲染采购单详情+审批进度 → 流式推送到企微</text>

  <!-- 回程箭头 -->
  <line x1="590" y1="548" x2="590" y2="564" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 2" marker-end="url(#a)"/>
  <line x1="590" y1="600" x2="590" y2="616" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 2" marker-end="url(#a)"/>

  <!-- ========== 横切介入说明 ========== -->
  <line x1="40" y1="670" x2="640" y2="670" stroke="#888780" stroke-width="0.5" stroke-dasharray="6 3"/>
  <text class="th" x="340" y="692" text-anchor="middle" fill="#2C2C2A" font-size="12">横切模块在每一步的介入</text>

  <!-- M2 介入 -->
  <rect x="40" y="706" width="600" height="56" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text class="th" x="60" y="724" dominant-baseline="central" fill="#791F1F" font-size="11">M2 安全与治理</text>
  <text class="ts" x="200" y="724" dominant-baseline="central">Step1: 输入过滤(Prompt注入检测) → Step2: PII脱敏(金额可否展示)</text>
  <text class="ts" x="60" y="748" dominant-baseline="central">→ Step5: 权限校验(该用户能否创建3万采购单) → Step9: 输出审核(幻觉检测)</text>

  <!-- M1 介入 -->
  <rect x="40" y="770" width="600" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="th" x="60" y="790" dominant-baseline="central" fill="#444441" font-size="11">M1 反思与学习</text>
  <text class="ts" x="200" y="790" dominant-baseline="central">全链路日志记录 → 失败归因 → 同义词"华为"→本体同步更新</text>

  <!-- M3 介入 -->
  <rect x="40" y="818" width="600" height="40" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text class="th" x="60" y="838" dominant-baseline="central" fill="#0C447C" font-size="11">M3 基础设施</text>
  <text class="ts" x="200" y="838" dominant-baseline="central">Token成本归因(本次对话消耗￥0.12) → 限流检查 → Tracing链路ID: trace-a3f8</text>

  <!-- 向下箭头汇总线 -->
  <line x1="30" y1="44" x2="30" y2="418" stroke="#888780" stroke-width="0.5" marker-end="url(#a)"/>
  <text class="label" x="16" y="230" text-anchor="middle" fill="#888780" transform="rotate(-90,16,230)" font-size="10">请求向下</text>

  <line x1="630" y1="518" x2="630" y2="648" stroke="#888780" stroke-width="0.5" marker-end="url(#a)"/>
  <text class="label" x="644" y="584" text-anchor="middle" fill="#888780" transform="rotate(90,644,584)" font-size="10">响应向上</text>

</svg>
